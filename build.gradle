plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'io.freefair.lombok' version '8.14'
    id 'com.diffplug.spotless' version '8.1.0'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath + client.runtimeClasspath
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

configurations {
    runtimeClasspath.extendsFrom(localRuntime)
    clientRuntimeClasspath.extendsFrom(clientLocalRuntime)
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
    createRemappingConfiguration(configurations.clientLocalRuntime)
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup('com.gregtechceu.gtceu')
            includeGroup('appeng')
        }
    }

    maven {
        url = uri("https://maven.shedaniel.me/")
        content {
            includeGroup("me.shedaniel")
            includeGroup("me.shedaniel.cloth")
            includeGroup("dev.architectury")
        }
    }

    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
    maven {
        name = 'FirstDarkDev'
        url = "https://maven.firstdarkdev.xyz/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url = "https://cursemaven.com/"
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
        // For Gradle 5.1 and above, limit it to just AE2
        content {
            includeGroup 'appeng'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        name = "ftbMavenReleases"
        url = uri("https://maven.ftb.dev/releases")
    }
    maven { url = "https://maven.bawnorton.com/releases" }

    exclusiveContent { // Curios
        forRepository { maven { url = "https://maven.theillusivec4.top/" } }
        filter { includeGroup('top.theillusivec4.curios') }
    }
}

base { archivesName = mod_id }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            sourceSet = sourceSets.client
            programArguments.addAll('--refresh-dependencies')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            sourceSet = sourceSets.extra
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = sourceSets.main

            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.2-1")
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("maven.modrinth:jade:${jade_version}")

    modImplementation("brachy.modularui:modularui-mc${minecraft_version}:${mui_version}") { transitive = false }

    // GTm
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // AE2
    modImplementation("appeng:appliedenergistics2-forge:${ae2_version}")
    modImplementation("org.appliedenergistics:guideme:${guideme_version}")

    // Extended AE2
    modImplementation("curse.maven:ex-pattern-provider-892005:8203753")
    modImplementation("curse.maven:glodium-957920:5226922")

    // Modern AE2
    modImplementation("curse.maven:mae2-1028068:7084998")

    // AE2WTLib
    modImplementation("curse.maven:applied-energistics-2-wireless-terminals-459929:7251206")
    modRuntimeOnly("me.shedaniel.cloth:cloth-config-forge:${clothVersion}")
    modRuntimeOnly("dev.architectury:architectury-forge:${architecturyVersion}")
    modRuntimeOnly("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1")

    // Perf/Visual mods for testing
    modClientLocalRuntime("maven.modrinth:oculus:${oculus_version}")
    modClientLocalRuntime("maven.modrinth:embeddium:${embeddium_version}")
    modCompileOnly("maven.modrinth:oculus:${oculus_version}")
    modCompileOnly("maven.modrinth:embeddium:${embeddium_version}")

    compileOnly('org.projectlombok:lombok:1.18.24')
    annotationProcessor('org.projectlombok:lombok:1.18.24')
}
/*
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}
*/

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             mod_credits            : mod_credits,
                             mui_version            : mui_version,
                             mui_version_range      : mui_version_range,
                             ae2_version            : ae2_version,
                             ae2_version_range      : ae2_version_range,
                             gtceu_version          : gtceu_version,
                             gtceu_version_range    : gtceu_version_range,]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

processResources {
    exclude '.cache'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true" // shut up mixin
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    encoding 'UTF-8'

    format 'misc', {
        target '.gitignore'

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }

    java {
        target 'src/main/java/**/*.java'

        def orderFile = file("$rootDir/spotless/import-order")
        def formatFile = file("$rootDir/spotless/eclipse-format.xml")

        toggleOffOn()
        importOrderFile(orderFile)
        forbidWildcardImports()
        removeUnusedImports()
        endWithNewline()
        eclipse('4.31').configFile(formatFile)
    }
}
