modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

issueTrackerURL="https://github.com/WhitePhant0m/MatterManipulator/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://github.com/WhitePhant0m/MatterManipulator/"
#logoFile="examplemod.png"
credits="${mod_credits}"
authors = "${mod_authors}"

description = '''${mod_description}'''

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "modularui"
mandatory = true
versionRange = "${mui_version_range}"
ordering = "NONE"
side = "BOTH"
